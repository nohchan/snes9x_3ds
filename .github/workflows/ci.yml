name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build project
        run: make release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snes9x_3ds-build
          path: |
            output/snes9x_3ds.3dsx
            output/snes9x_3ds.cia
          if-no-files-found: error
          retention-days: 14
